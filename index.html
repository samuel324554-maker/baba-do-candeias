<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baba do Candeias - Conquista</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>body{font-family:Inter,sans-serif}.tab-active{background:#16a34a;color:white}</style>
</head>
<body class="bg-slate-950 text-white min-h-screen">
<header class="bg-gradient-to-r from-green-700 to-green-500 p-5 rounded-b-[25px]">
<div class="max-w-4xl mx-auto flex justify-between items-center">
<div><h1 class="text-2xl font-extrabold">⚽ Baba do Candeias</h1><p class="text-green-100 text-sm">Vitória da Conquista - BA • Ao vivo na nuvem</p></div>
<div class="bg-white text-green-700 px-3 py-1 rounded-full text-xs font-bold animate-pulse">● AO VIVO</div>
</div>
</header>
<div class="max-w-4xl mx-auto p-4">
<div class="flex gap-2 overflow-x-auto pb-2 mt-2">
<button onclick="aba('jogos')" id="btn-jogos" class="tab-active px-4 py-2 rounded-full font-bold"><i class="fa-solid fa-calendar"></i> Jogos</button>
<button onclick="aba('times')" id="btn-times" class="bg-slate-800 px-4 py-2 rounded-full font-bold"><i class="fa-solid fa-people-group"></i> Times</button>
<button onclick="aba('ranking')" id="btn-ranking" class="bg-slate-800 px-4 py-2 rounded-full font-bold"><i class="fa-solid fa-trophy"></i> Ranking</button>
<button onclick="aba('artilharia')" id="btn-artilharia" class="bg-slate-800 px-4 py-2 rounded-full font-bold"><i class="fa-solid fa-futbol"></i> Artilharia</button>
</div>
<div id="sec-jogos" class="mt-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<h3 class="font-bold text-lg mb-3">➕ Adicionar Baba</h3>
<div class="grid grid-cols-2 gap-2">
<input id="data" type="date" class="bg-slate-950 border border-slate-700 rounded-xl p-3">
<input id="hora" type="time" value="08:00" class="bg-slate-950 border border-slate-700 rounded-xl p-3">
</div>
<input id="local" placeholder="📍 Local: Campo do Candeias" class="w-full mt-2 bg-slate-950 border border-slate-700 rounded-xl p-3">
<input id="times" placeholder="⚽ Ex: Os Primos x Candeias FC" class="w-full mt-2 bg-slate-950 border border-slate-700 rounded-xl p-3">
<button onclick="salvarJogo()" class="w-full mt-3 bg-green-600 py-3 rounded-xl font-bold">Salvar na Nuvem para Todos</button>
<p id="statusJogo" class="text-center text-green-400 text-sm mt-2"></p>
</div>
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 mt-4">
<h3 class="font-bold">📅 Próximos Babas - Sincronizado</h3>
<div id="listaJogos" class="mt-3 space-y-2">Carregando da nuvem...</div>
</div>
</div>
<div id="sec-times" class="hidden mt-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<h3 class="font-bold">👕 Cadastrar Time</h3>
<input id="nomeTime" placeholder="Nome do time" class="w-full mt-2 bg-slate-950 border border-slate-700 rounded-xl p-3">
<button onclick="salvarTime()" class="w-full mt-2 bg-blue-600 py-3 rounded-xl font-bold">Salvar Time na Nuvem</button>
</div><div id="listaTimes" class="mt-4 grid gap-2"></div>
</div>
<div id="sec-ranking" class="hidden mt-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<h3 class="font-bold">🏆 Ranking</h3>
<div class="flex gap-2 mt-3">
<input id="timeRank" placeholder="Time" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl p-3">
<input id="pontosRank" type="number" placeholder="Pontos" class="w-24 bg-slate-950 border border-slate-700 rounded-xl p-3">
</div>
<button onclick="salvarRanking()" class="w-full mt-2 bg-yellow-600 py-3 rounded-xl font-bold">Salvar Ranking</button>
<div id="listaRanking" class="mt-4"></div>
</div>
</div>
<div id="sec-artilharia" class="hidden mt-4">
<div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
<h3 class="font-bold">⚽ Artilharia</h3>
<div class="grid grid-cols-2 gap-2 mt-3">
<input id="jogador" placeholder="Nome do jogador" class="bg-slate-950 border border-slate-700 rounded-xl p-3">
<input id="gols" type="number" placeholder="Gols" class="bg-slate-950 border border-slate-700 rounded-xl p-3">
</div>
<button onclick="salvarArtilharia()" class="w-full mt-2 bg-orange-600 py-3 rounded-xl font-bold">Salvar Artilheiro</button>
<div id="listaArtilharia" class="mt-4"></div>
</div>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBOAcvw9TvgKhNzi_qmsioXcLheC4Erww",
  authDomain: "baba-do-candeias.firebaseapp.com",
  databaseURL: "https://baba-do-candeias-default-rtdb.firebaseio.com",
  projectId: "baba-do-candeias",
  storageBucket: "baba-do-candeias.appspot.com",
  messagingSenderId: "227896511604",
  appId: "1:227896511604:web:5cd1213b30f64b19d89521"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
window.aba = function(nome){
  ['jogos','times','ranking','artilharia'].forEach(a=>{
    document.getElementById('sec-'+a).classList.add('hidden');
    document.getElementById('btn-'+a).classList.remove('tab-active');
    document.getElementById('btn-'+a).classList.add('bg-slate-800');
  });
  document.getElementById('sec-'+nome).classList.remove('hidden');
  document.getElementById('btn-'+nome).classList.add('tab-active');
  document.getElementById('btn-'+nome).classList.remove('bg-slate-800');
}
window.salvarJogo = function(){
  const data=document.getElementById('data').value;
  const hora=document.getElementById('hora').value;
  const local=document.getElementById('local').value;
  const times=document.getElementById('times').value;
  if(!data||!local) return alert('Preencha data e local');
  push(ref(db,'jogos'),{data,hora,local,times,criado:Date.now()});
  document.getElementById('statusJogo').innerText='✅ Salvo! Todo mundo já vê!';
  setTimeout(()=>document.getElementById('statusJogo').innerText='',2000);
  document.getElementById('local').value='';document.getElementById('times').value='';
}
window.salvarTime = function(){
  const nome=document.getElementById('nomeTime').value;
  if(!nome) return;
  push(ref(db,'times'),{nome,criado:Date.now()});
  document.getElementById('nomeTime').value='';
}
window.salvarRanking = function(){
  const time=document.getElementById('timeRank').value;
  const pontos=parseInt(document.getElementById('pontosRank').value)||0;
  if(!time) return;
  push(ref(db,'ranking'),{time,pontos,criado:Date.now()});
  document.getElementById('timeRank').value='';document.getElementById('pontosRank').value='';
}
window.salvarArtilharia = function(){
  const jogador=document.getElementById('jogador').value;
  const gols=parseInt(document.getElementById('gols').value)||0;
  if(!jogador) return;
  push(ref(db,'artilharia'),{jogador,gols,criado:Date.now()});
  document.getElementById('jogador').value='';document.getElementById('gols').value='';
}
onValue(ref(db,'jogos'), snap=>{
  const div=document.getElementById('listaJogos'); div.innerHTML='';
  const dados=snap.val(); if(!dados){div.innerHTML='<p class=text-slate-500>Nenhum jogo</p>';return;}
  Object.entries(dados).sort((a,b)=>b[1].criado-a[1].criado).forEach(([id,j])=>{
    div.innerHTML+=`<div class="bg-slate-950 border-l-4 border-green-500 p-3 rounded-xl flex justify-between"><div><b>${j.data} ${j.hora}</b><br>📍 ${j.local}<br>⚽ ${j.times}</div><button onclick="apagar('jogos/${id}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button></div>`;
  });
});
onValue(ref(db,'times'), snap=>{
  const div=document.getElementById('listaTimes'); div.innerHTML='';
  const dados=snap.val(); if(!dados) return;
  Object.entries(dados).forEach(([id,t])=>{ div.innerHTML+=`<div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between"><span>👕 ${t.nome}</span><button onclick="apagar('times/${id}')" class="text-red-400">Apagar</button></div>`; });
});
onValue(ref(db,'ranking'), snap=>{
  const div=document.getElementById('listaRanking'); div.innerHTML='';
  const dados=snap.val(); if(!dados) return;
  const lista=Object.entries(dados).map(([id,v])=>({...v,id})).sort((a,b)=>b.pontos-a.pontos);
  lista.forEach((r,i)=>{ div.innerHTML+=`<div class="flex justify-between bg-slate-950 p-3 rounded-xl mt-2"><span>${i+1}º ${r.time}</span><b>${r.pontos} pts</b><button onclick="apagar('ranking/${r.id}')" class="text-red-400">x</button></div>`; });
});
onValue(ref(db,'artilharia'), snap=>{
  const div=document.getElementById('listaArtilharia'); div.innerHTML='';
  const dados=snap.val(); if(!dados) return;
  const lista=Object.entries(dados).map(([id,v])=>({...v,id})).sort((a,b)=>b.gols-a.gols);
  lista.forEach((r,i)=>{ div.innerHTML+=`<div class="flex justify-between bg-slate-950 p-3 rounded-xl mt-2"><span>${i+1}º ${r.jogador}</span><b>${r.gols} gols</b><button onclick="apagar('artilharia/${r.id}')" class="text-red-400">x</button></div>`; });
});
window.apagar = function(path){ if(confirm('Apagar para todos?')) remove(ref(db,path)); }
</script>
</body>
</html>
