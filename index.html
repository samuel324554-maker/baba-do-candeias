<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baba do Candeias - Ao Vivo</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;padding:15px}
.header{background:#16a34a;padding:20px;border-radius:15px;text-align:center}
.badge{background:#dcfce7;color:#166534;padding:5px 12px;border-radius:20px;font-weight:bold;display:inline-block;margin-top:8px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-top:15px}
input,button{width:100%;padding:12px;border-radius:8px;border:none;margin-top:8px}
input{background:#0f172a;color:white;border:1px solid #334155}
button{background:#22c55e;color:white;font-weight:bold}
.jogo{border-left:4px solid #22c55e;padding:10px;margin:8px 0;background:#0f172a;border-radius:8px}
</style>
</head>
<body>
<div class="header">
<h1>⚽ Baba do Candeias</h1>
<div class="badge">✅ Conectado na nuvem</div>
<div>● AO VIVO NA NUVEM</div>
</div>

<div class="card">
<h3>➕ Adicionar Próximo Jogo</h3>
<input id="data" type="date">
<input id="hora" type="time" value="08:00">
<input id="local" placeholder="Local: Campo do Candeias">
<input id="times" placeholder="Times: Time A x Time B">
<button onclick="salvarJogo()">Salvar na Nuvem para Todos</button>
<p id="status"></p>
</div>

<div class="card">
<h3>📅 Próximos Jogos</h3>
<div id="listaJogos">Carregando...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOAcvww9TvgKWnZi_qmsioXcLheC4Erww",
  authDomain: "baba-do-candeias.firebaseapp.com",
  databaseURL: "https://baba-do-candeias-default-rtdb.firebaseio.com",
  projectId: "baba-do-candeias",
  storageBucket: "baba-do-candeias.appspot.com",
  messagingSenderId: "227896511604",
  appId: "1:227896511604:web:5cd1213b30f64b19d89521"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const jogosRef = ref(db, 'jogos');

window.salvarJogo = function(){
  const data = document.getElementById('data').value;
  const hora = document.getElementById('hora').value;
  const local = document.getElementById('local').value;
  const times = document.getElementById('times').value;
  if(!data || !local){ alert('Preencha data e local'); return; }
  push(jogosRef, { data, hora, local, times, criadoEm: Date.now() });
  document.getElementById('status').innerText = '✅ Salvo! Todo mundo já vê!';
  setTimeout(()=>document.getElementById('status').innerText='',3000);
}

onValue(jogosRef, (snap)=>{
  const div = document.getElementById('listaJogos');
  div.innerHTML='';
  const dados = snap.val();
  if(!dados){ div.innerHTML='Nenhum jogo ainda'; return; }
  Object.entries(dados).reverse().forEach(([id, j])=>{
    div.innerHTML += `<div class="jogo"><b>${j.data} às ${j.hora}</b><br>📍 ${j.local}<br>⚽ ${j.times} <br><button onclick="apagar('${id}')" style="background:#ef4444;width:auto;padding:5px 10px;margin-top:5px">Apagar</button></div>`;
  });
});

window.apagar = function(id){ if(confirm('Apagar para todos?')) remove(ref(db, 'jogos/'+id)); }
</script>
</body>
</html>
